#:schema https://developers.openai.com/codex/config-schema.json

approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = false
writable_roots = []
exclude_tmpdir_env_var = true
exclude_slash_tmp = true

[mcp_servers.gbrain]
enabled = false

[mcp_servers.hpe-mcp]
enabled = false

[mcp_servers.rust-junosmcp]
enabled = true
enabled_tools = ["get_router_list", "gather_device_facts", "get_junos_config", "junos_config_diff"]
default_tools_approval_mode = "writes"

[mcp_servers.rust-srxmcp]
enabled = true
enabled_tools = ["srxmcp_status", "get_srx_security_services_status", "get_chassis_cluster_status", "vpn_lifecycle_report"]
default_tools_approval_mode = "writes"

[mcp_servers.panos-mcp]
enabled = true
enabled_tools = ["list_devices", "get_pan_config", "pan_config_diff"]
default_tools_approval_mode = "writes"

[mcp_servers.proxmox-mcp]
enabled = true
enabled_tools = ["get_cluster_status", "get_nodes", "get_node_status", "get_vms", "get_vm_config", "get_containers", "get_container_config", "get_storage", "list_backups", "list_snapshots"]
default_tools_approval_mode = "writes"

[mcp_servers.unifi-mcp]
enabled = true
enabled_tools = ["health_check", "list_sites", "get_site_health_summary", "get_site_inventory", "get_network_topology", "list_devices_by_type", "get_device_details", "get_device_statistics"]
default_tools_approval_mode = "writes"

[mcp_servers.openaiDeveloperDocs]
enabled = true
enabled_tools = ["search_openai_docs", "fetch_openai_doc"]
