#:schema https://developers.openai.com/codex/config-schema.json

approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = false
writable_roots = []
exclude_tmpdir_env_var = true
exclude_slash_tmp = true

[mcp_servers.gbrain]
enabled = false

[mcp_servers.unifi-mcp]
enabled = true
enabled_tools = ["health_check", "list_sites", "get_site_health_summary", "get_site_inventory", "get_network_topology", "list_devices_by_type", "get_device_details", "get_device_statistics"]
default_tools_approval_mode = "writes"

[mcp_servers.openaiDeveloperDocs]
enabled = true
enabled_tools = ["search_openai_docs", "fetch_openai_doc"]
