name: mcp-query CI

on:
  pull_request:
    paths:
      - "services/mcp-query/**"
      - ".github/workflows/mcp-query-ci.yml"
  push:
    branches: [main]
    paths:
      - "services/mcp-query/**"
      - ".github/workflows/mcp-query-ci.yml"
  # Manual trigger, so the suite can be run without inventing a code change.
  # Needed at least once here: this repository was recreated to publish a
  # scrubbed history, and a branch-creation push does not match the path
  # filters above, so nothing would ever have run.
  workflow_dispatch:

concurrency:
  group: mcp-query-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (unit, no live ClickHouse)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/mcp-query
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync deps (incl. dev)
        run: uv sync --extra dev
      - name: Unit tests
        # Integration tests (@pytest.mark.integration) need a live ClickHouse and
        # are deselected here; they run against the real fabric on ct106.
        run: uv run pytest tests/ -m "not integration" -q
