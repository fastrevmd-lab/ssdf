title = "ssdf gitleaks config"

[extend]
path = ".gitleaks-vendor.toml"

[allowlist]
description = "Test fixtures and vendored external repos"
paths = ['''(^|/)\.paperclip-repositories/''']
regexes = [
    '00112233445566778899aabbccddeeff',
    'SANITIZED_KEY_[0-9a-z]',
    '(ASA|OPENSSH|EC|PKCS8)-PRIVATE-BLOCK-ORIGINAL',
]
