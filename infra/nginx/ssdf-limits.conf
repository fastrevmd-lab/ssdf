# SSDF MCP edge — shared rate/connection-limit zones (edge-hardening M2).
# limit_req_zone / limit_conn_zone are http-context-only directives, so they
# live here in /etc/nginx/conf.d/ (included inside http {}), not in the server
# blocks. Identical file on ct106 and ct113.
#
# 10 r/s sustained with burst 30 absorbs an agent's tool-call fan-out while
# capping brute-force/token-guessing throughput per source IP.
limit_req_zone $binary_remote_addr zone=mcp:10m rate=10r/s;

# Streamable-HTTP keeps connections open for the SSE response stream, so a
# per-IP connection cap (applied as limit_conn mcpconn 32 in the server block)
# bounds slow-loris style exhaustion without breaking long-lived MCP sessions.
limit_conn_zone $binary_remote_addr zone=mcpconn:10m;
