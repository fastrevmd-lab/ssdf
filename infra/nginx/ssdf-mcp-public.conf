# SSDF public-tier MCP edge (ct113, 198.51.100.154) — nginx TLS terminator.
# Edge-hardening design 2026-06-11 (M2 + L1b + L3 + L6). Mirrors
# ssdf-mcp-query.conf; this is the worst-case exposure host (public-tier
# tokens), so the same per-IP limits apply.
# LAN clients keep using port 30033; uvicorn rebinds to 127.0.0.1:31033.
#
# Installed to /etc/nginx/sites-available/ + symlinked into sites-enabled by
# scripts/apply_mcp_edge.sh. Debian includes sites-enabled/* inside http {},
# so the map below is in valid (http) context; the limit zones it references
# live in conf.d/ssdf-limits.conf.

# L6 Origin gate: no Origin (CLI clients) or our own https origin only.
map $http_origin $ssdf_origin_denied {
    default                            1;
    ""                                 0;  # non-browser clients (no Origin)
    "https://198.51.100.154:30033"      0;
    "https://ssdf-mcp-public:30033"    0;
}

# L6 catch-all: unknown Host header -> connection dropped (444).
server {
    listen 30033 ssl default_server;
    server_name _;
    ssl_certificate     /etc/nginx/ssdf/ct113.crt;
    ssl_certificate_key /etc/nginx/ssdf/ct113.key;
    return 444;
}

server {
    listen 30033 ssl;
    # Host allow-list: the LAN IP plus the container hostname.
    server_name 198.51.100.154 ssdf-mcp-public;

    ssl_certificate     /etc/nginx/ssdf/ct113.crt;
    ssl_certificate_key /etc/nginx/ssdf/ct113.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:ssdf_ssl:1m;

    # M2: per-IP request rate + concurrent-connection caps (zones in
    # conf.d/ssdf-limits.conf). Surfaced as 429 so agents can back off.
    limit_req zone=mcp burst=30 nodelay;
    limit_req_status 429;
    limit_conn mcpconn 32;
    limit_conn_status 429;

    client_max_body_size 10m;

    if ($ssdf_origin_denied) {
        return 403;
    }

    location / {
        proxy_pass http://127.0.0.1:31033;
        # Streamable-HTTP/SSE requirements: HTTP/1.1 keep-alive to upstream,
        # no response buffering, long read timeout for open event streams.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
