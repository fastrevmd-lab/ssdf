# SSDF sovereign MCP edge (ct106, 198.51.100.152) — nginx TLS terminator.
# Edge-hardening design 2026-06-11 (M2 + L1b + L3 + L6).
# LAN clients keep using port 30032; only the scheme changes (http -> https).
# uvicorn is rebound to loopback 127.0.0.1:31032 (systemd drop-in edge.conf).
#
# Installed to /etc/nginx/sites-available/ + symlinked into sites-enabled by
# scripts/apply_mcp_edge.sh. Debian includes sites-enabled/* inside http {},
# so the map below is in valid (http) context; the limit zones it references
# live in conf.d/ssdf-limits.conf.

# L6 Origin gate: MCP CLI clients send no Origin header (allowed); browsers
# must present the server's own https origin or get 403 (DNS-rebinding /
# cross-site defense). map is evaluated lazily per request — no per-conn cost.
map $http_origin $ssdf_origin_denied {
    default                            1;
    ""                                 0;  # non-browser clients (no Origin)
    "https://198.51.100.152:30032"      0;
    "https://ssdf-mcp-query:30032"     0;
}

# L6 catch-all: any TLS request whose Host header matches no server_name below
# (e.g. a rebound DNS name) is dropped without a response (444). nginx still
# needs a cert to complete the handshake before it can read Host.
server {
    listen 30032 ssl default_server;
    server_name _;
    ssl_certificate     /etc/nginx/ssdf/ct106.crt;
    ssl_certificate_key /etc/nginx/ssdf/ct106.key;
    return 444;
}

server {
    listen 30032 ssl;
    # Host allow-list: the LAN IP plus the container hostname.
    server_name 198.51.100.152 ssdf-mcp-query;

    ssl_certificate     /etc/nginx/ssdf/ct106.crt;
    ssl_certificate_key /etc/nginx/ssdf/ct106.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # Modern guidance: let TLS1.2+ clients pick from their (safe) preference.
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:ssdf_ssl:1m;

    # M2: per-IP request rate + concurrent-connection caps (zones in
    # conf.d/ssdf-limits.conf). Surfaced as 429 so agents can back off.
    limit_req zone=mcp burst=30 nodelay;
    limit_req_status 429;
    limit_conn mcpconn 32;
    limit_conn_status 429;

    # MCP tool calls are small JSON bodies; 10m is generous headroom.
    client_max_body_size 10m;

    if ($ssdf_origin_denied) {
        return 403;
    }

    location / {
        proxy_pass http://127.0.0.1:31032;
        # Streamable-HTTP/SSE requirements: HTTP/1.1 keep-alive to upstream,
        # no response buffering (events must flush immediately), and a long
        # read timeout for idle-but-open event streams.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
