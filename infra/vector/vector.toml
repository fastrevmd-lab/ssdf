'''

[[tests]]
name = "panos_system_maps_to_ecs"
[[tests.inputs]]
insert_at = "panos_ecs"
type = "raw"
value = '<14>Jun 06 23:23:00 panosvm.example.com ,2026/06/06 23:23:00,007054000270810,SYSTEM,general,,2026/06/06 23:23:00,vsys1,general,,,,general,informational,System started successfully'
[[tests.outputs]]
extract_from = "panos_ecs"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
assert!(starts_with(string!(.event_action), "system_"))
assert_eq!(.event_action, "system_general")
assert_eq!(.event_category, ["host"])
assert_eq!(.event_provider, "paloalto")
assert_eq!(.ext."panw.panos.severity", "informational")
assert!(!exists(.source_ip))
'''

[[tests]]
name = "panos_traffic_ipv6_source_left_null"
[[tests.inputs]]
insert_at = "panos_ecs"
type = "raw"
value = '<14>Jun 06 23:24:00 panosvm.example.com ,2026/06/06 23:24:00,007054000270810,TRAFFIC,end,,2026/06/06 23:24:00,2001:db8::1,198.51.100.20,0.0.0.0,0.0.0.0,allow-trust-to-untrust,,,ssl,vsys1,trust,untrust,ethernet1/2,ethernet1/1,,,40004,1,52344,443,0,0,0x0,tcp,allow,8000,3000,5000,40,2026/06/06 23:23:30,30,any,,1004,0x0,::-::,US,,22,18,tcp-fin'
[[tests.outputs]]
extract_from = "panos_ecs"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
assert_eq!(.event_action, "flow_end")
assert!(!exists(.source_ip))
assert_eq!(.destination_ip, "198.51.100.20")
assert!(contains(string!(.raw), "2001:db8::1"))
'''

[[tests]]
name = "panos_malformed_line_is_unknown"
[[tests.inputs]]
insert_at = "panos_ecs"
type = "raw"
value = '<14>Jun 06 23:25:00 panosvm.example.com garbage-not-a-panos-line'
[[tests.outputs]]
extract_from = "panos_ecs"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
assert_eq!(.event_action, "unknown")
assert_eq!(.event_provider, "paloalto")
assert!(!exists(.source_ip))
'''

[[tests]]
name = "panos_config_maps_admin_and_command"
[[tests.inputs]]
insert_at = "panos_ecs"
type = "raw"
value = '<14>Jun 06 23:26:00 panosvm.example.com ,2026/06/06 23:26:00,007054000270810,CONFIG,set,,2026/06/06 23:26:00,198.51.100.225,vsys1,set,admin,198.51.100.199,Succeeded,vsys vsys1 rulebase security'
[[tests.outputs]]
extract_from = "panos_ecs"
[[tests.outputs.conditions]]
type = "vrl"
source = '''
assert_eq!(.event_action, "config_set")
assert_eq!(.event_category, ["configuration"])
assert_eq!(.event_provider, "paloalto")
assert_eq!(.user_name, "admin")
assert_eq!(.ext."panw.panos.command", "set")
assert_eq!(.ext."panw.panos.client", "198.51.100.199")
assert_eq!(.ext."panw.panos.result", "Succeeded")
assert!(!exists(.source_ip))
'''
