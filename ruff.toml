line-length = 100

[lint]
select = ["E4", "E7", "E9", "F"]

# No per-file-ignores. The exact-file adoption baseline that used to live here
# suppressed 40 real violations across 29 entries; they were fixed on
# 2026-08-26 rather than carried, so every rule now applies everywhere.
#
# The one intentional exception is expressed where it belongs -- a local
# `# noqa: F401` on the `Auditor` re-export in mcp-query's server.py, which is
# a test patch seam and says so on the line itself. A per-file ignore would
# have hidden that reason in this file, far from the code it protects.
