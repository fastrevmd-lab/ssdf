# SSDF golden eval corpus v1 (M8). 33 questions, 5 categories, tier-tagged.
# Contract: docs/superpowers/specs/2026-06-12-ssdf-m8-eval-harness-design.md

# ---- reachability / policy ----
- id: reach-rule-trust-untrust
  question: >-
    Which firewall rule allowed the most recent traffic from 10.74.11.20
    to 198.51.100.1?
  tier: sovereign
  category: reachability
  difficulty: medium
  answer_format: 'Answer with JSON: {"rule": "<rule name>"}'
  required_tools: [explain_access]
  predicate:
    type: reference_sql
    sql: >-
      SELECT rule_name FROM ssdf.events
      WHERE source_ip = toIPv6('10.74.11.20')
        AND destination_ip = toIPv6('198.51.100.1') AND rule_name != ''
      ORDER BY timestamp DESC LIMIT 1
    match: exact
    answer_key: rule

- id: reach-firewall-attribution
  question: >-
    Which firewall(s) logged flows between 10.74.11.20 and 198.51.100.1?
  tier: sovereign
  category: reachability
  difficulty: medium
  answer_format: 'Answer with JSON: {"firewalls": ["<name>", ...]}'
  required_tools: [explain_access, observed_by]
  predicate:
    type: reference_sql
    sql: >-
      SELECT DISTINCT splitByChar('.', observer_hostname)[1] FROM ssdf.events
      WHERE source_ip = toIPv6('10.74.11.20')
        AND destination_ip = toIPv6('198.51.100.1') AND observer_hostname != ''
    match: exact
    answer_key: firewalls

- id: reach-configured-policy-count-panosvm
  question: How many configured security policies does the firewall panosvm have?
  tier: sovereign
  category: reachability
  difficulty: hard
  answer_format: 'Answer with JSON: {"count": <int>}'
  required_tools: [configured_policies]
  predicate:
    type: reference_sql
    sql: >-
      SELECT count(DISTINCT entity_id) FROM ssdf.entities
      WHERE kind = 'policy' AND source = 'configured'
        AND identifiers['provider'] = 'paloalto'
        AND identifiers['device_name'] = 'panosvm'
    match: numeric_tolerance
    answer_key: count
    params: {tolerance: 0}

- id: reach-busiest-pair-panosvm
  question: >-
    Which source->destination IP pair generated the most flows logged by
    panosvm in the last 24 hours?
  tier: sovereign
  category: reachability
  difficulty: hard
  answer_format: 'Answer with JSON: {"pair": "<src ip>-><dst ip>"}'
  required_tools: []
  predicate:
    type: reference_sql
    sql: >-
      SELECT concat(toString(source_ip), '->', toString(destination_ip)) AS pair
      FROM ssdf.events
      WHERE observer_hostname LIKE 'panosvm%'
        AND timestamp >= now() - INTERVAL 24 HOUR
        AND source_ip IS NOT NULL AND destination_ip IS NOT NULL
      GROUP BY pair ORDER BY count() DESC LIMIT 1
    match: exact
    answer_key: pair

# ---- flows ----
- id: flows-top-talkers-24h
  question: Who were the top 3 talkers (source IPs) by bytes in the last 24 hours?
  tier: sovereign
  category: flows
  difficulty: medium
  answer_format: 'Answer with JSON: {"talkers": [{"ip": "<ip>", "bytes": <int>}, ...]}'
  required_tools: [top_talkers]
  predicate:
    type: reference_sql
    sql: >-
      SELECT toString(source_ip) FROM ssdf.events
      WHERE timestamp >= now() - INTERVAL 24 HOUR AND source_ip IS NOT NULL
      GROUP BY source_ip ORDER BY sum(network_bytes) DESC LIMIT 3
    match: set_overlap
    answer_key: talkers
    item_key: ip
    params: {min_overlap: 2}

- id: flows-event-count-24h
  question: How many events were ingested in the last 24 hours?
  tier: sovereign
  category: flows
  difficulty: easy
  answer_format: 'Answer with JSON: {"count": <int>}'
  required_tools: []
  predicate:
    type: reference_sql
    sql: >-
      SELECT count() FROM ssdf.events
      WHERE timestamp >= now() - INTERVAL 24 HOUR
    match: numeric_tolerance
    answer_key: count
    params: {tolerance_pct: 10}

- id: flows-providers-7d
  question: Which vendors (event providers) have logged events in the last 7 days?
  tier: sovereign
  category: flows
  difficulty: easy
  answer_format: 'Answer with JSON: {"providers": ["<provider>", ...]}'
  required_tools: []
  predicate:
    type: reference_sql
    sql: >-
      SELECT DISTINCT event_provider FROM ssdf.events
      WHERE timestamp >= now() - INTERVAL 7 DAY
    match: exact
    answer_key: providers

- id: flows-top-dest-ports-24h
  question: What were the top 3 destination ports by flow count in the last 24 hours?
  tier: sovereign
  category: flows
  difficulty: medium
  answer_format: 'Answer with JSON: {"ports": [<int>, <int>, <int>]}'
  required_tools: []
  predicate:
    type: reference_sql
    sql: >-
      SELECT toString(destination_port) FROM ssdf.events
      WHERE timestamp >= now() - INTERVAL 24 HOUR AND destination_port IS NOT NULL
      GROUP BY destination_port ORDER BY count() DESC LIMIT 3
    match: set_overlap
    answer_key: ports
    params: {min_overlap: 2}

- id: flows-paloalto-actions-7d
  question: Which event actions has the paloalto provider logged in the last 7 days?
  tier: sovereign
  category: flows
  difficulty: easy
  answer_format: 'Answer with JSON: {"actions": ["<action>", ...]}'
  required_tools: []
  predicate:
    type: reference_sql
    sql: >-
      SELECT DISTINCT event_action FROM ssdf.events
      WHERE event_provider = 'paloalto' AND timestamp >= now() - INTERVAL 7 DAY
    match: exact
    answer_key: actions

- id: flows-total-bytes-7d
  question: Approximately how many total bytes were logged across all flows in the last 7 days?
  tier: sovereign
  category: flows
  difficulty: hard
  answer_format: 'Answer with JSON: {"bytes": <int>}'
  required_tools: []
  predicate:
    type: reference_sql
    sql: >-
      SELECT sum(network_bytes) FROM ssdf.events
      WHERE timestamp >= now() - INTERVAL 7 DAY
    match: numeric_tolerance
    answer_key: bytes
    params: {tolerance_pct: 15}

# ---- public metrics (M7c de-identified surface) ----
- id: metric-bytes-total-24h
  question: >-
    Using the public metrics surface, what is the total bytes volume across all
    time buckets in the last 24 hours?
  tier: public
  category: flows
  difficulty: medium
  answer_format: 'Answer with JSON: {"bytes": <int>}'
  required_tools: [metric_timeseries]
  predicate:
    type: reference_sql
    sql: >-
      SELECT toInt64(sum(value)) FROM ssdf_public.metric_timeseries FINAL
      WHERE metric = 'bytes' AND dim = ''
        AND bucket_start >= now() - INTERVAL 24 HOUR
    match: numeric_tolerance
    answer_key: bytes
    params: {tolerance_pct: 10}

- id: metric-top-surrogate-bytes-24h
  question: >-
    On the public metrics surface, which host surrogate had the highest total
    bytes in the last 24 hours?
  tier: public
  category: flows
  difficulty: medium
  answer_format: 'Answer with JSON: {"surrogate": "<surrogate id>"}'
  required_tools: [top_series]
  predicate:
    type: reference_sql
    sql: >-
      SELECT surrogate FROM ssdf_public.entity_series FINAL
      WHERE metric = 'bytes'
        AND bucket_start >= now() - INTERVAL 24 HOUR
      GROUP BY surrogate ORDER BY sum(value) DESC LIMIT 1
    match: exact
    answer_key: surrogate

- id: metric-busiest-surrogate-volume-24h
  question: >-
    On the public metrics surface, for the host surrogate with the highest total
    bytes in the last 24 hours, how many bytes did it accumulate over that window?
  tier: public
  category: flows
  difficulty: hard
  answer_format: 'Answer with JSON: {"bytes": <int>}'
  required_tools: [entity_metric_timeseries, top_series]
  predicate:
    type: reference_sql
    sql: >-
      SELECT toInt64(max(total)) FROM (
        SELECT sum(value) AS total FROM ssdf_public.entity_series FINAL
        WHERE metric = 'bytes'
          AND bucket_start >= now() - INTERVAL 24 HOUR
        GROUP BY surrogate)
    match: numeric_tolerance
    answer_key: bytes
    params: {tolerance_pct: 10}

# ---- topology ----
- id: topo-locate-labgen
  question: Which firewall(s) observe traffic from IP 10.74.11.20?
  tier: sovereign
  category: topology
  difficulty: easy
  answer_format: 'Answer with JSON: {"firewalls": ["<name>", ...]}'
  required_tools: [observed_by]
  predicate:
    type: reference_sql
    sql: >-
      SELECT DISTINCT splitByChar('.', observer_hostname)[1] FROM ssdf.events
      WHERE source_ip = toIPv6('10.74.11.20') AND observer_hostname != ''
    match: set_overlap
    answer_key: firewalls
    params: {min_overlap: 1}

- id: topo-entity-kind-panosvm
  question: What kind of entity is panosvm, and what role does it have?
  # sovereign-only since M7c: the public tier no longer exposes topology/identity
  # tools (only the 3 de-identified metrics tools), so get_entity is sovereign-only.
  tier: sovereign
  category: topology
  difficulty: easy
  answer_format: 'Answer with JSON: {"kind": "<kind>", "role": "<role>"}'
  required_tools: [get_entity]
  predicate:
    type: expected_json
    expected: {kind: device, role: firewall}

- id: topo-firewall-inventory
  question: Which devices in the topology are firewalls?
  # sovereign-only: firewall role-attribution is a sovereign capability. The public
  # graph carries no role=firewall device nodes (only pve hypervisors as devices);
  # firewall-named Proxmox guests appear as host nodes, so the question is
  # structurally unanswerable on the public tier. See 2026-06-19 3-model matrix.
  tier: sovereign
  category: topology
  difficulty: medium
  answer_format: 'Answer with JSON: {"firewalls": ["<name>", ...]}'
  required_tools: [topology_snapshot]
  predicate:
    type: expected_json
    expected: {firewalls: [panosvm, vsrx-br01, vsrx-br02, vsrx-br03, vsrx-br04, vsrx-br05, vsrx-br06, vsrx-br07, vsrx-br08, vsrx-br09, vsrx-br10, vsrx-br11, vsrx-br12, vsrx-campus-a, vsrx-campus-b, vsrx-ci, vsrx-core-a, vsrx-core-b, vsrx-dc, vsrx-dmz, vsrx-isp-a, vsrx-isp-b, vsrx-prod, vsrx-wan-edge]}

- id: topo-path-labgen-gateway
  question: >-
    Does a path exist in the topology graph between 10.74.11.20 and
    198.51.100.1?
  # sovereign-only since M7c: find_path is a topology tool, removed from the
  # public tier when it became the de-identified metrics surface.
  tier: sovereign
  category: topology
  difficulty: hard
  answer_format: 'Answer with JSON: {"path_exists": <true|false>}'
  required_tools: [find_path]
  predicate:
    type: expected_json
    expected: {path_exists: true}

- id: identity-reidentify-busiest-surrogate
  question: >-
    On the public metrics surface, the host surrogate with the highest total
    bytes in the last 24 hours maps to which real IP address?
  tier: sovereign
  category: topology
  difficulty: hard
  answer_format: 'Answer with JSON: {"ip": "<ip address>"}'
  required_tools: [reidentify]
  predicate:
    type: reference_sql
    sql: >-
      SELECT real_value FROM ssdf.pseudonym_map FINAL
      WHERE kind = 'host' AND surrogate = (
        SELECT surrogate FROM ssdf_public.entity_series FINAL
        WHERE metric = 'bytes'
          AND bucket_start >= now() - INTERVAL 24 HOUR
        GROUP BY surrogate ORDER BY sum(value) DESC LIMIT 1)
      LIMIT 1
    match: exact
    answer_key: ip

